<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b91c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Quick billing for South Indian tiffin items and rice flour batter (maavu) sales." />
    <title>Dhanalakshmi Tiffen Stall</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Companion to public/404.html's redirect: restore the real path before React Router mounts.
      (function () {
        var params = new URLSearchParams(location.search)
        var redirect = params.get('redirect')
        if (redirect === null) return
        params.delete('redirect')
        var rest = params.toString()
        var basePath = '%BASE_URL%'
        var newUrl = basePath + redirect + (rest ? '?' + rest : '') + location.hash
        history.replaceState(null, '', newUrl)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
