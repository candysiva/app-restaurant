<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dhanalakshmi Tiffen Stall</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct load or refresh of a
      // client-side route (e.g. /app-restaurant/orders) 404s. Redirect it through
      // index.html with the intended path encoded in a query param; index.html's
      // inline script below restores it via history.replaceState before React mounts.
      var basePath = '/app-restaurant/'
      var path = location.pathname.slice(basePath.length)
      location.replace(basePath + '?redirect=' + encodeURIComponent(path) + location.search.replace(/^\?/, '&') + location.hash)
    </script>
  </head>
  <body></body>
</html>
